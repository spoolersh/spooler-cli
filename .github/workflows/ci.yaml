name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this on the tagged commit before goreleaser.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./... && go vet ./...

  # The install script is POSIX sh: dash is the strictest common reading of
  # it, and shellcheck in sh mode flags what dash would not. Its behaviour
  # is script/install_test.go's, under the test job above.
  install-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: |
          dash -n script/install.sh
          shellcheck -s sh script/install.sh
