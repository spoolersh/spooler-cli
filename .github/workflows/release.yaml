# Publishes a release from a tag: the binaries, the archives and their
# checksums on the release page, once the tagged commit passes CI. A
# release is cut by hand: tag the commit v<X> and push the tag; the
# version is the tag's, which goreleaser writes into the binary.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The CLI never ships behaviour the SDK does not have: the tree must
      # require a tagged SDK, not a checkout or a pseudo-version.
      - name: Check module
        run: |
          if grep -q '^replace ' go.mod; then
            echo 'go.mod has a replace directive'
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*(require[[:space:]]+)?github\.com/spoolersh/spooler-go v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' go.mod; then
            echo 'go.mod does not require a tagged spooler-go'
            exit 1
          fi

      # The skill describes one release: the one the tag names.
      - name: Check skill version
        run: |
          grep -Fxq "  version: $GITHUB_REF_NAME" skills/spooler-cli/SKILL.md

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tells spoolersh/ai to mirror skills/spooler-cli from this release, so
  # the copy there does not wait for the daily run. Its own job: the
  # release is out once the job above ends, and a failed dispatch must not
  # paint it red. GITHUB_TOKEN cannot dispatch to another repository;
  # MIRROR_TOKEN is a token with contents write on spoolersh/ai.
  mirror:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Dispatch
        run: |
          gh api repos/spoolersh/ai/dispatches \
            -f event_type=mirror \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[tag]=$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
